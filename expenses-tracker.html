<title>Expenses Tracker</title>
<style>
  /* ---- Page setup ---- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #121212;
    color: #eee;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  h1 { text-align: center; margin: 8px 0 16px; font-size: 24px; }

  /* ---- Total cards ---- */
  .totals { display: flex; gap: 12px; margin-bottom: 16px; }
  .card {
    flex: 1;
    background: #1e1e1e;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    border: 1px solid #333;
  }
  .card .label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .card .amount { font-size: 22px; font-weight: bold; color: #4caf50; }

  /* ---- Form ---- */
  form {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  form input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2a2a2a;
    color: #eee;
    font-size: 16px;
  }
  form button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  form button:active { background: #43a047; }

  /* ---- Expense list ---- */
  .expense {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .expense .note { font-size: 15px; }
  .expense .date { font-size: 12px; color: #999; margin-top: 2px; }
  .expense .right { text-align: right; }
  .expense .amt { font-weight: bold; color: #ff8a65; font-size: 16px; }
  .expense .del {
    background: none;
    border: none;
    color: #777;
    font-size: 18px;
    cursor: pointer;
    margin-top: 4px;
  }
  .expense .del:active { color: #f44336; }
  .empty { text-align: center; color: #777; padding: 24px 0; }

  /* ---- Export / Import buttons ---- */
  .data-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .data-row button {
    flex: 1;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2a2a2a;
    color: #eee;
    font-size: 14px;
    cursor: pointer;
  }
  .data-row button:active { background: #333; }

  /* ---- Date stepper ---- */
  .date-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .date-row input { flex: 1; margin-bottom: 0; }
  .date-row button {
    padding: 10px 14px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2a2a2a;
    color: #eee;
    font-size: 16px;
    cursor: pointer;
  }

  /* ---- Day groups + hide toggle ---- */
  .day-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #999;
    margin: 14px 2px 6px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .day-header span:last-child { color: #4caf50; }
  .toggle-btn {
    width: 100%;
    padding: 10px;
    margin-bottom: 4px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #2a2a2a;
    color: #eee;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>💰 Expenses</h1>

<!-- Total cards -->
<div class="totals">
  <div class="card">
    <div class="label">Today</div>
    <div class="amount" id="todayTotal">₹0</div>
  </div>
  <div class="card">
    <div class="label">This Month</div>
    <div class="amount" id="monthTotal">₹0</div>
  </div>
</div>

<!-- Add expense form -->
<form id="expenseForm">
  <input type="number" id="amount" placeholder="Amount (₹)" min="1" step="any" required>
  <input type="text" id="note" placeholder="What was it for?" required>
  <div class="date-row">
    <button type="button" id="prevDay">◀</button>
    <input type="date" id="date" required>
    <button type="button" id="nextDay">▶</button>
  </div>
  <button type="submit">+ Add Expense</button>
</form>

<!-- Export / Import -->
<div class="data-row">
  <button id="exportBtn">⬇ Export JSON</button>
  <button id="importBtn">⬆ Import JSON</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<!-- Expense list -->
<button id="toggleEntries" class="toggle-btn">🙈 Hide entries</button>
<div id="list"></div>

<script>
  // ---- Data: load from phone storage, or start empty ----
  let expenses = JSON.parse(localStorage.getItem('strike_expenses') || '[]');

  // Default the date field to today (IST). valueAsDate uses UTC, so set the string directly.
  const dateInput = document.getElementById('date');
  dateInput.value = istDay(new Date());

  // Date stepper: move the entry date back/forward one day
  function shiftDate(n) {
    const parts = (dateInput.value || istDay(new Date())).split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setDate(d.getDate() + n);
    dateInput.value = istDay(d);
  }
  document.getElementById('prevDay').addEventListener('click', () => shiftDate(-1));
  document.getElementById('nextDay').addEventListener('click', () => shiftDate(1));

  // Hide / show entries (preference is remembered)
  const toggleBtn = document.getElementById('toggleEntries');
  function applyHidden() {
    const hidden = localStorage.getItem('strike_expenses_hidden') === '1';
    document.getElementById('list').style.display = hidden ? 'none' : '';
    toggleBtn.textContent = hidden ? '🐵 Show entries' : '🙈 Hide entries';
  }
  toggleBtn.addEventListener('click', () => {
    const hidden = localStorage.getItem('strike_expenses_hidden') === '1';
    localStorage.setItem('strike_expenses_hidden', hidden ? '0' : '1');
    applyHidden();
  });
  applyHidden();

  // Pretty day label: "Fri, 2 Oct 2026"
  function fmtDate(d) {
    return new Date(d + 'T00:00').toLocaleDateString('en-IN',
      { timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  // decode it. Keep this file private.
  const _w1 = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1NTMwNTgyNDQxNzQ4MDcxNC9KSWJHakFSTF";
  const _w2 = "RCZmNHRDNyaG1QN0lmdEZqR3Z4SldXcXZpWGsyaHpUcFBoUW9HQ1hsdVNnRzhhYzlkbTE0bzVUckRBaQ==";
  const DISCORD_WEBHOOK = atob(_w1 + _w2);

  async function syncToDiscord() {
    try {
      const json = JSON.stringify(expenses, null, 2);
      const form = new FormData();
      form.append("file", new Blob([json], { type: "application/json" }), "expenses.json");
      const total = expenses.reduce((s, e) => s + e.amount, 0);
      form.append("payload_json", JSON.stringify({
        content: `\uD83D\uDCB0 Expenses backup \u2014 ${expenses.length} entries, \u20B9${total} total`
      }));
      await fetch(DISCORD_WEBHOOK, { method: "POST", body: form });
    } catch (e) {
      // offline or failed — data is still safe on the phone
    }
  }

  // ---- Save + re-render ----
  function save() {
    localStorage.setItem('strike_expenses', JSON.stringify(expenses));
    render();
    syncToDiscord(); // fire-and-forget backup
  }

  // ---- Add expense ----
  document.getElementById('expenseForm').addEventListener('submit', function (e) {
    e.preventDefault(); // stop the page from reloading
    expenses.push({
      id: Date.now(), // unique id for deleting later
      amount: parseFloat(document.getElementById('amount').value),
      note: document.getElementById('note').value.trim(),
      date: dateInput.value // "YYYY-MM-DD"
    });
    // newest first
    expenses.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    save();
  });

  // ---- Delete expense ----
  function remove(id) {
    expenses = expenses.filter(e => e.id !== id);
    save();
  }

  // ---- Export: download data as a JSON file ----
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(expenses, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'expenses-' + istDay(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---- Import: load data from a JSON file ----
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('bad file');
        expenses = data.filter(x => x && typeof x.amount === 'number' && typeof x.date === 'string');
        expenses.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
        save();
        alert('Imported ' + expenses.length + ' expenses ✅');
      } catch (err) {
        alert('That file is not a valid expenses backup ❌');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // "YYYY-MM-DD" in IST, no matter what timezone the device is set to
  function istDay(d) {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(d);
  }

  // ---- Render everything ----
  function render() {
    const today = istDay(new Date());
    const month = today.slice(0, 7); // "YYYY-MM"

    let todaySum = 0, monthSum = 0;
    expenses.forEach(e => {
      if (e.date === today) todaySum += e.amount;
      if (e.date.slice(0, 7) === month) monthSum += e.amount;
    });
    document.getElementById('todayTotal').textContent = '₹' + todaySum;
    document.getElementById('monthTotal').textContent = '₹' + monthSum;

    const list = document.getElementById('list');
    if (!expenses.length) {
      list.innerHTML = '<div class="empty">No expenses yet. Add your first one above 👆</div>';
      return;
    }
    // group by day, newest day first
    const groups = {};
    expenses.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
    const days = Object.keys(groups).sort().reverse();
    const yesterday = istDay(new Date(Date.now() - 864e5));
    list.innerHTML = days.map(d => {
      const dayTotal = groups[d].reduce((s, e) => s + e.amount, 0);
      const label = d === today ? 'Today' : d === yesterday ? 'Yesterday' : fmtDate(d);
      const rows = groups[d].map(e => `
        <div class="expense">
          <div><div class="note">${escapeHtml(e.note)}</div><div class="date">${e.date}</div></div>
          <div class="right">
            <div class="amt">₹${e.amount}</div>
            <button class="del" onclick="remove(${e.id})">✕</button>
          </div>
        </div>`).join('');
      return `<div class="day-header"><span>${label}</span><span>₹${dayTotal}</span></div>` + rows;
    }).join('');
  }

  // Prevent HTML injection from the note field
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  render();
</script>
</body>
</html>
